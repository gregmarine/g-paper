org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Phase 3: the Onyx SDK AARs bundle pre-AndroidX support classes; jetifier rewrites
# them. Only needed by builds that include gpaper-onyx (generic-only consumers skip it).
android.enableJetifier=true
# Published artifact coordinates (Phase 6 — mavenLocal-only publishing).
# `./gradlew publishToMavenLocal` publishes gpaper-core / gpaper-onyx / gpaper-ratta.
GPAPER_GROUP=com.symmetricalpalmtree.gpaper
GPAPER_VERSION=0.1.2
